# ✅ AGREGAR: Nombre de la aplicación
spring:
  application:
    name: eureka-server

# ✅ AGREGAR: Puerto del servidor
server:
  port: 8761

eureka:
  # ✅ AGREGAR: Configuración del cliente (importante)
  client:
    registerWithEureka: false      # No se registra a sí mismo
    fetchRegistry: false            # No necesita obtener el registro
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  
  server:
    enable-self-preservation: true
    eviction-interval-timer-in-ms: 60000
    renewal-percent-threshold: 0.85
    # ✅ AGREGAR: Para desarrollo, desactivar autopreservación (opcional)
    # enable-self-preservation: false

  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    prefer-ip-address: true

logging:
  level:
    "[com.netflix.eureka]": WARN
    "[com.netflix.discovery]": WARN
    # ✅ AGREGAR: Para ver el registro de servicios
    "[org.springframework.cloud.netflix.eureka]": INFO