spring:
  application:
    name: multa-service
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/multa_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root1234}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect

server:
  port: ${SERVER_PORT:8089}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka}
  instance:
    preferIpAddress: true
    hostname: ${HOSTNAME:localhost}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

logging:
  level:
    root: INFO
    com.biblioteca: DEBUG