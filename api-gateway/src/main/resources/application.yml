spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        discovery:
          locator:
            enabled: true
            lower-case-service-id: true
        routes:
          - id: autenticacion-service-route
            uri: lb://autenticacion-service
            predicates:
              - Path=/api/autenticacion/**
            filters:
              - AddRequestHeader=X-Gateway-Source, api-gateway

          - id: autor-service-route
            uri: lb://autor-service
            predicates:
              - Path=/api/autores/**
            filters:
              - AddRequestHeader=X-Gateway-Source, api-gateway

          - id: categoria-service-route
            uri: lb://categoria-service
            predicates:
              - Path=/api/categorias/**
            filters:
              - AddRequestHeader=X-Gateway-Source, api-gateway

          - id: inventario-service-route
            uri: lb://inventario-service
            predicates:
              - Path=/api/inventario/**
            filters:
              - AddRequestHeader=X-Gateway-Source, api-gateway

          - id: libro-service-route
            uri: lb://libro-service
            predicates:
              - Path=/api/libros/**
            filters:
              - AddRequestHeader=X-Gateway-Source, api-gateway

          - id: multa-service-route
            uri: lb://multa-service
            predicates:
              - Path=/api/multas/**
            filters:
              - AddRequestHeader=X-Gateway-Source, api-gateway

          - id: prestamo-service-route
            uri: lb://prestamo-service
            predicates:
              - Path=/api/prestamos/**
            filters:
              - AddRequestHeader=X-Gateway-Source, api-gateway

          - id: reporte-service-route
            uri: lb://reporte-service
            predicates:
              - Path=/api/reportes/**
            filters:
              - AddRequestHeader=X-Gateway-Source, api-gateway

          - id: reserva-service-route
            uri: lb://reserva-service
            predicates:
              - Path=/api/reservas/**
            filters:
              - AddRequestHeader=X-Gateway-Source, api-gateway

          - id: usuario-service-route
            uri: lb://usuario-service
            predicates:
              - Path=/api/usuarios/**
            filters:
              - AddRequestHeader=X-Gateway-Source, api-gateway



eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
 
logging:
  level:
    "[org.springframework.cloud.gateway]": DEBUG
    "[cl.duoc.api_gateway]": DEBUG