services:
  # ============================================
  # BASE DE DATOS
  # ============================================
  mysql:
    image: mysql:8.4.9-oraclelinux9
    container_name: mysql-biblioteca
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root1234}
      - MYSQL_DATABASE=biblioteca_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root1234}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - biblioteca-network

  # ============================================
  # EUREKA SERVER
  # ============================================
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_HOSTNAME=eureka-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - biblioteca-network

  # ============================================
  # MICROSERVICIOS
  # ============================================

  autenticacion-service:
    build: ./autenticacion-service
    container_name: autenticacion-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - SERVER_PORT=8081
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=autenticacion_db
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD:-root1234}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - biblioteca-network

  usuario-service:
    build: ./usuario-service
    container_name: usuario-service
    ports:
      - "8082:8082"
