  # ============================================
  # API GATEWAY
  # ============================================
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - biblioteca-network

# ============================================
# VOLÚMENES
# ============================================
volumes:
  mysql-data:

# ============================================
# REDES
# ============================================
networks:
  biblioteca-network:
    driver: bridge