spring:
  datasource:
    url: jdbc:mysql://localhost:3306/autor_db
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

# Configuración específica para desarrollo
services:
  libros:
    url: http://localhost:8082  # ← URL del libro-service en desarrollo
